[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ats-auditor"
version = "0.1.0"
description = "Privacy-first, deterministic resume parseability and job-match diagnostics"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Himavanth Mahesh" }
]
keywords = ["ats", "resume", "privacy", "career", "document-analysis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "pypdf>=5.0",
  "python-docx>=1.1"
]

[project.urls]
Homepage = "https://github.com/HimavanthMahesh/local-ats-auditor"
Repository = "https://github.com/HimavanthMahesh/local-ats-auditor"
Issues = "https://github.com/HimavanthMahesh/local-ats-auditor/issues"

[project.scripts]
local-ats-auditor = "ats_auditor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
